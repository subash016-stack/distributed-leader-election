[project]
name = "distributed-leader-election"
version = "2.0.0"
description = "Distributed Leader Election in Networked Systems Using MPI and Multithreading over Gnutella P2P Network"
authors = [{ name = "Subash", email = "subash16.01.2006@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "networkx>=3.2.1",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mpi4py>=3.1.5",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
